    <script>
      // Redirecionamento automático no GitHub Pages para a pasta compilada /docs/
      // Isso elimina definitivamente o erro de MIME type ("application/octet-stream") do navegador.
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname;
          if (!p.includes('/docs')) {
            if (!p.endsWith('/')) p += '/';
            window.location.replace(p + 'docs/');
          }
        }
      })();
    </script>
